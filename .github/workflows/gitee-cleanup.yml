name: Gitee cleanup (one-shot)

# 一次性任务：删除 Gitee 上的旧仓库 Zi-Yi-Ming.github.io（GitHub 账号改名后
# 该镜像仓库已冻结，新仓库 ZiY1Ming.github.io 由 mirror-to-gitee 自动创建）。
# 仅手动触发；跑完验证后请删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-old-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Gitee repo
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail
          OLD_REPO="Zi-Yi-Ming.github.io"
          API="https://gitee.com/api/v5/repos/${GITEE_USERNAME}/${OLD_REPO}"
          echo "Target: ${API}"
          echo "--- before ---"
          curl -s --max-time 30 -o /tmp/before.json -w "status=%{http_code}\n" \
            -H "Authorization: token ${GITEE_TOKEN}" "${API}" || echo "curl failed"
          cat /tmp/before.json 2>/dev/null | head -c 300; echo
          echo "--- delete ---"
          curl -s --max-time 60 -X DELETE -o /tmp/del.json -w "status=%{http_code}\n" \
            -H "Authorization: token ${GITEE_TOKEN}" \
            "${API}?access_token=${GITEE_TOKEN}" || echo "curl failed"
          head -c 300 /tmp/del.json 2>/dev/null; echo
          echo "--- after ---"
          curl -s --max-time 30 -o /tmp/after.json -w "status=%{http_code}\n" \
            -H "Authorization: token ${GITEE_TOKEN}" "${API}"
          cat /tmp/after.json 2>/dev/null | head -c 300; echo
          # 404 = 已不存在（删除成功或本就无此仓库），其余非 2xx/404 视为失败
          STATUS_AFTER=$(curl -s --max-time 30 -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITEE_TOKEN}" "${API}")
          echo "final check status: ${STATUS_AFTER}"
          if [ "${STATUS_AFTER}" != "404" ]; then
            echo "::error::old repo still present (status ${STATUS_AFTER})"
            exit 1
          fi
          echo "OK: old Gitee repo removed"
