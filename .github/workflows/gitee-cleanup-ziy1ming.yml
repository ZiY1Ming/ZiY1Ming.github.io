name: Gitee cleanup ZiY1Ming (one-shot)

# 一次性任务：删除 Gitee 上 ZiY1Ming.github.io（GitHub 账号改回 Zi-Yi-Ming 后
# 该仓库已冻结，活跃镜像是 Zi-Yi-Ming.github.io）。
# 仅手动触发；跑完验证后请删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-frozen-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Delete frozen Gitee repo ZiY1Ming.github.io
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -uo pipefail
          OLD_REPO="ZiY1Ming.github.io"
          API="https://gitee.com/api/v5/repos/${GITEE_USERNAME}/${OLD_REPO}"
          echo "Target: ${API}"
          echo "--- before ---"
          curl -s --max-time 60 -H "Authorization: token ${GITEE_TOKEN}" "${API}" -w "\nstatus=%{http_code}\n" | tail -c 200
          # DELETE 重试 3 次（上次单次 60s 超时未生效）
          for i in 1 2 3; do
            echo "--- delete attempt ${i}/3 ---"
            CODE=$(curl -s --max-time 180 -X DELETE -o /tmp/del.json -w "%{http_code}" \
              -H "Authorization: token ${GITEE_TOKEN}" \
              "${API}?access_token=${GITEE_TOKEN}")
            echo "delete status=${CODE}"
            head -c 200 /tmp/del.json 2>/dev/null; echo
            [ "${CODE}" = "204" ] || [ "${CODE}" = "200" ] && break
            sleep 15
          done
          # 验证：最多查 5 次，404 才算真的没了
          OK=0
          for i in 1 2 3 4 5; do
            CODE=$(curl -s --max-time 60 -o /dev/null -w "%{http_code}" \
              -H "Authorization: token ${GITEE_TOKEN}" "${API}")
            echo "verify ${i}: status=${CODE}"
            if [ "${CODE}" = "404" ]; then OK=1; break; fi
            sleep 15
          done
          if [ "$OK" != "1" ]; then
            echo "::error::frozen Gitee repo still present after 3 delete attempts"
            exit 1
          fi
          echo "OK: ZiY1Ming.github.io removed from Gitee"
